<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÑOMCRAFT — Recetario Pixel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span id="brand-icon" class="brand-icon"></span>
    <h1 class="logo">ÑOMCRAFT</h1>
    <span class="brand-sub">recetario v1.0</span>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab" data-view="index">Indice</button>
    <button class="tab" data-view="masas">Masas</button>
    <button class="tab" data-view="pantry">Despensa</button>
    <button class="tab" data-view="shopping">Compras</button>
  </nav>

  <div class="data-actions">
    <button class="btn small blue" id="export"
            title="Descargar todo el recetario (recetas + ingredientes) en un archivo JSON">Exportar JSON</button>
    <button class="btn small" id="import"
            title="Cargar un recetario desde un archivo JSON">Importar</button>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
    <button class="btn small" id="help" title="Ver tutorial">?</button>
    <button class="btn small" id="info-toggle" title="Activar/desactivar cuadros de información al pasar el mouse" aria-pressed="false">i</button>
  </div>
</header>

<main id="view" class="view"></main>

<div id="tutorial-overlay" class="tutorial-overlay" hidden>
  <div class="tutorial-box pbox">
    <button class="btn small red" id="tutorial-close" style="position:absolute;top:10px;right:10px;padding:4px 8px;">X</button>
    <p class="tutorial-step-label" id="tutorial-step-label">PASO 1 DE 6</p>
    <h2 class="tutorial-title" id="tutorial-title"></h2>
    <p class="tutorial-text" id="tutorial-text"></p>
    <div class="tutorial-footer">
      <div class="tutorial-dots" id="tutorial-dots"></div>
      <div class="tutorial-nav">
        <button class="btn small ghost" id="tutorial-prev">ATRAS</button>
        <button class="btn small green" id="tutorial-next">SIGUIENTE</button>
      </div>
    </div>
  </div>
</div>

<footer class="statusbar">
  <span id="status-left">LISTO.</span>
  <span id="status-right"></span>
</footer>

<div id="toast" class="toast" hidden></div>

<script src="js/info-tooltip.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/masas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
